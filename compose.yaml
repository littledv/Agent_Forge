name: agentforge

services:
  postgresql:
    image: postgres:${POSTGRESQL_VERSION:-16.15}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporal-local-only}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agentforge-postgresql:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - agentforge

  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.32.1}
    restart: "no"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-temporal-local-only}
      POSTGRES_SEEDS: postgresql
      SQL_PASSWORD: ${POSTGRES_PASSWORD:-temporal-local-only}
    volumes:
      - ./infra/temporal:/agentforge-temporal:ro
    entrypoint: ["/bin/sh"]
    command: /agentforge-temporal/setup-postgres.sh
    networks:
      - agentforge

  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.32.1}
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-temporal-local-only}
      POSTGRES_SEEDS: postgresql
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "127.0.0.1:7233:7233"
    volumes:
      - ./infra/temporal/development-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    networks:
      - agentforge

  temporal-create-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.32.1}
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACES: default agentforge-test
    volumes:
      - ./infra/temporal:/agentforge-temporal:ro
    entrypoint: ["/bin/sh"]
    command: /agentforge-temporal/create-namespace.sh
    networks:
      - agentforge

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.54.1}
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:3000
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - agentforge

volumes:
  agentforge-postgresql:

networks:
  agentforge:
    driver: bridge
